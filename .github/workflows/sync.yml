name: Provider Sync

# Aggregation is driven here (NOT by an in-process scheduler). Every 6 hours we
# POST to the backend's admin sync endpoint. Manual runs via workflow_dispatch.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: provider-sync
  cancel-in-progress: false

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend synchronization
        env:
          API_URL: ${{ secrets.EVENTMESH_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL}" ] || [ -z "${ADMIN_TOKEN}" ]; then
            echo "::warning::EVENTMESH_API_URL / ADMIN_SYNC_TOKEN not set yet — skipping."
            exit 0
          fi
          url="${API_URL%/}/api/v1/admin/sync"
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 600 \
            -X POST "${url}" \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json")
          echo "HTTP ${code}"
          cat response.json || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Sync failed with HTTP ${code}"
            exit 1
          fi

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventMesh — Discover events from Eventbrite, Meetup & Luma</title>
    <meta name="description" content="EventMesh aggregates events from Eventbrite, Meetup, and Luma into one unified discovery feed — search, filter, and jump straight to the source." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050505" />
    <link rel="canonical" href="https://eventmesh.xyz/" />

    <!-- Open Graph / Twitter (per-route values are refined at runtime) -->
    <meta property="og:site_name" content="EventMesh" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EventMesh — Discover events from Eventbrite, Meetup & Luma" />
    <meta property="og:description" content="One unified discovery feed for events aggregated from Eventbrite, Meetup, and Luma." />
    <meta property="og:url" content="https://eventmesh.xyz/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EventMesh — Discover events from Eventbrite, Meetup & Luma" />
    <meta name="twitter:description" content="One unified discovery feed for events aggregated from Eventbrite, Meetup, and Luma." />

    <link rel="preconnect" href="https://eventmesh-api.onrender.com" />
    <link rel="preconnect" href="https://images.lumacdn.com" crossorigin />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('eventmesh-theme');
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

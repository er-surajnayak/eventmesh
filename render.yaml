# Render Blueprint (Infrastructure-as-Code). Connect this repo in Render and it
# provisions the service from this file — no manual dashboard clicking for config.
# Secret values (sync: false) are set once in the Render dashboard/CLI.
services:
  - type: web
    name: eventmesh-api
    runtime: docker
    repo: https://github.com/er-surajnayak/eventmesh
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore  # closest Render free region to the Supabase DB (Mumbai)
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_SYNC_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EVENTBRITE_API_KEY
        sync: false
